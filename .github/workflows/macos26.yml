---
name: macOS 26

on:
  push:
    branches: [ master ]
    paths:
    - 'pkg-macos11/**'
    - 'pkg_automation.bash'
    - '.github/workflows/macos26.yml'

  pull_request:
    branches: [ master ]
    paths:
    - 'pkg-macos11/**'
    - 'pkg_automation.bash'
    - '.github/workflows/macos26.yml'

  workflow_dispatch:


jobs:

  macOS26:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install modern bash
        run: brew install bash
      - name: Test on macOS 26
        run: |
          BASH_BIN="$(brew --prefix)/bin/bash"
          "$BASH_BIN" --version | head -1
          "$BASH_BIN" pkg_automation.bash -y

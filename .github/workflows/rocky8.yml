---
name: Rocky Linux 8

on:
  push:
    branches: [ master ]
    paths:
    - 'pkg-rocky8/**'
    - 'pkg_automation.bash'
    - 'tests/rocky-python.bash'
    - '.github/workflows/rocky8.yml'

  pull_request:
    branches: [ master ]


jobs:

  Rocky8:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:8.10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use the primary Rocky package server
        run: sed -i 's/^mirrorlist=/#mirrorlist=/; s/^#baseurl=/baseurl=/' /etc/yum.repos.d/Rocky-*.repo
      - name: Test on Rocky 8 Docker
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          dnf install -y sudo
          export LC_CTYPE=C.UTF-8
          export LC_ALL=C.UTF-8
          bash tests/rocky-python.bash
      - name: Upload Rocky Python evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rocky8-python
          path: ${{ runner.temp }}/pkg-python.*

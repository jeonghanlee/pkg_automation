---
name: Rocky Linux 10

on:
  push:
    branches: [ master ]
    paths:
    - 'pkg-rocky10/**'
    - 'pkg_automation.bash'
    - 'tests/rocky-python.bash'
    - '.github/workflows/rocky10.yml'

  pull_request:
    branches: [ master ]


jobs:

  Rocky10:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test on Rocky 10 Docker
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          dnf install -y sudo
          export LC_CTYPE=C.UTF-8
          export LC_ALL=C.UTF-8
          bash tests/rocky-python.bash
      - name: Upload Rocky Python evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rocky10-python
          path: ${{ runner.temp }}/pkg-python.*
